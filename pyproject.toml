[project]
name = "buildsight-ai"
version = "0.1.0"
description = "Synthetic construction intelligence portfolio with grounded retrieval and approval workflows"
requires-python = ">=3.13"
dependencies = ["fastapi", "uvicorn", "langgraph", "langgraph-checkpoint-sqlite", "scikit-learn", "networkx"]
[project.optional-dependencies]
dev = ["pytest", "httpx", "ruff"]
[tool.pytest.ini_options]
pythonpath = ["."]
[tool.ruff]
line-length = 120
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
