<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BuildSight AI</title><style>body{font:17px system-ui;background:#10212c;color:#eaf2f5;max-width:1000px;margin:40px auto;padding:24px}h1{font-size:44px}label{display:block;margin:16px 0}input,textarea,select,button{font:inherit;padding:12px;border-radius:8px}textarea{width:95%;min-height:80px}button{background:#f4bb63;cursor:pointer;margin:8px}pre{white-space:pre-wrap;background:#1c3543;padding:24px;border-radius:12px;overflow:auto}.tag{color:#f4bb63}</style><h1>BuildSight AI</h1><p class="tag">CONSTRUCTION INTELLIGENCE · SYNTHETIC PORTFOLIO DEMO</p><p>Evidence search, relationship tracing and engineer-reviewed workflow drafts. Advisory only.</p><label>API key <input id="key" type="password" value="local-demo-key"></label><label>Project question<textarea id="q">Which unresolved RFIs could delay the bridge deck pour?</textarea></label><label>Workflow <select id="kind"><option>rfi</option><option>schedule</option><option>risk</option></select></label><button onclick="ask()">Search evidence</button><button onclick="start()">Create review draft</button><button onclick="relations()">View relationships</button><label>Review reason <input id="reason" value="Reviewed synthetic evidence"></label><button onclick="decide(true)">Approve local draft</button><button onclick="decide(false)">Reject draft</button><pre id="out" aria-live="polite">Ready. No vendor systems are connected. Default mode uses no language model; an optional local Ollama model can be configured.</pre><script>let runId;const el=id=>document.getElementById(id);async function call(path,body){try{let r=await fetch(path,{method:body?'POST':'GET',headers:{'Content-Type':'application/json','x-api-key':el('key').value},body:body?JSON.stringify(body):undefined});let d=await r.json();el('out').textContent=JSON.stringify(d,null,2);if(!r.ok)throw Error(d.detail);return d}catch(e){el('out').textContent='Error: '+e.message;return null}}async function ask(){await call('/ask',{question:el('q').value})}async function start(){let d=await call('/runs',{question:el('q').value,kind:el('kind').value});if(d)runId=d.id}async function relations(){await call('/graph')}async function decide(approve){if(!runId){el('out').textContent='Create a draft first.';return}await call('/runs/'+runId+'/decision',{approve,reason:el('reason').value})}</script></html>
